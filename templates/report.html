<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Latest Reconnaissance Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <h2 class="mb-4 text-center">Latest Reconnaissance Report</h2>

  <table class="table table-bordered bg-white">
    <tbody>
      <tr><th scope="row">Site Name</th><td id="site_name">—</td></tr>
      <tr><th scope="row">Grid Reference</th><td id="grid_reference">—</td></tr>
      <tr><th scope="row">Area Size</th><td id="area_size">—</td></tr>
      <tr><th scope="row">Latitude</th><td id="lat">—</td></tr>
      <tr><th scope="row">Longitude</th><td id="lng">—</td></tr>
      <tr><th scope="row">Slope</th><td id="slope_category">—</td></tr>
      <tr><th scope="row">Elevation</th><td id="elevation">—</td></tr>
      <tr><th scope="row">Lighting</th><td id="lighting">—</td></tr>
      <tr><th scope="row">Hazards</th><td id="hazards">—</td></tr>
      <tr><th scope="row">Details</th><td id="details">—</td></tr>
      <tr><th scope="row">Reporter</th><td id="reporter_name">—</td></tr>
      <tr><th scope="row">Date/Time</th><td id="report_time">—</td></tr>
    </tbody>
  </table>

  <div class="text-center mt-4">
    <button id="approveBtn" class="btn btn-success me-2">Approve</button>
    <button id="rejectBtn" class="btn btn-danger">Reject</button>
  </div>
</div>

<script>
fetch('https://defencehackathon-83857943147.europe-west2.run.app/firestore/document/landingZones/latest')
  .then(r => r.json())
  .then(data => {
    document.getElementById('site_name').textContent = data.site_name || '—';
    document.getElementById('grid_reference').textContent = data.grid_reference || '—';
    document.getElementById('area_size').textContent = data.area_size || '—';
    document.getElementById('lat').textContent = data.lat || '—';
    document.getElementById('lng').textContent = data.lng || '—';
    document.getElementById('slope_category').textContent = data.slope_category || '—';
    document.getElementById('elevation').textContent = data.elevation || '—';
    document.getElementById('lighting').textContent = data.lighting || '—';
    document.getElementById('hazards').textContent = data.hazards || '—';
    document.getElementById('details').textContent = data.details || '—';
    document.getElementById('reporter_name').textContent = data.reporter_name || '—';
    document.getElementById('report_time').textContent = data.report_time || '—';
  });

  document.getElementById('approveBtn').onclick = () => {
  window.location.href = 'https://command-dashboard-2nd-iteration-83857943147.us-west1.run.app/';  
};

document.getElementById('rejectBtn').onclick = () => {
  window.location.href = 'https://command-dashboard-2nd-iteration-83857943147.us-west1.run.app/'; 
};
</script>

</body>
</html>
